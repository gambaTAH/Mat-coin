<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mat-coin</title>

<style>

/* RESET */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

/* BODY */

body{

    width:100%;
    height:100vh;

    background-image:url("fundo.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    overflow:hidden;

    display:flex;
    flex-direction:column;
}

/* SIDEBAR */

.sidebar{

    position:fixed;

    top:0;
    left:-320px;

    width:290px;
    height:100%;

    background:white;

    padding:35px 22px;

    box-shadow:10px 0 30px rgba(0,0,0,0.2);

    z-index:20;

    transition:0.35s;
}

.sidebar.active{

    left:0;
}

.sidebar h2{

    color:#0a6b35;

    font-size:32px;

    margin-bottom:30px;
}

/* MENU ITEM */

.menu-item{

    width:100%;

    padding:16px;

    border-radius:16px;

    margin-bottom:14px;

    background:#f3f3f3;

    color:#0a6b35;

    font-size:17px;

    font-weight:bold;

    transition:0.3s;

    cursor:pointer;
}

.menu-item:hover{

    background:#19b95d;

    color:white;

    transform:translateX(5px);
}

/* OVERLAY */

.overlay{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,0.35);

    opacity:0;

    pointer-events:none;

    transition:0.3s;

    z-index:15;
}

.overlay.active{

    opacity:1;

    pointer-events:auto;
}

/* MENU TOPO */

.topo{

    width:100%;

    padding:25px;
}

.menu-btn{

    width:70px;
    height:70px;

    border-radius:22px;

    background:rgba(255,255,255,0.10);

    backdrop-filter:blur(5px);

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:0.3s;
}

.menu-btn:hover{

    transform:scale(1.05);
}

.menu-icon{

    color:white;
    font-size:38px;
}

/* LOGO */

.logo{

    width:100%;

    display:flex;
    justify-content:center;

    margin-top:-140px;
}

.logo img{

    width:420px;
}

/* AREA DOS CARDS */

.cards{

    flex:1;

    display:flex;

    justify-content:center;
    align-items:center;

    gap:50px;

    padding:20px;

    margin-top:-120px;
}

/* CARD */

.card{

    width:380px;
    height:220px;

    background:rgba(255,255,255,0.95);

    border-radius:30px;

    padding:25px;

    display:flex;
    align-items:center;

    gap:20px;

    box-shadow:0px 10px 30px rgba(0,0,0,0.25);

    transition:0.3s;
}

.card:hover{

    transform:translateY(-8px) scale(1.02);
}

/* ICONE */

.icone{

    min-width:95px;
    height:95px;

    border-radius:24px;

    background:linear-gradient(135deg,#18a84f,#2ecc71);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:42px;
}

/* TEXTO */

.texto h2{

    color:#0a6b35;

    font-size:28px;

    margin-bottom:10px;

    min-height:65px;
}

.texto p{

    color:#555;

    font-size:16px;

    line-height:1.4;

    margin-bottom:18px;
}

/* BOTAO */

.botao{

    display:inline-block;

    text-decoration:none;

    background:linear-gradient(90deg,#0c8a44,#19b95d);

    color:white;

    padding:11px 24px;

    border-radius:12px;

    font-size:17px;
    font-weight:bold;

    transition:0.3s;
}

.botao:hover{

    transform:scale(1.05);

    box-shadow:0px 5px 15px rgba(0,0,0,0.2);
}

/* RESPONSIVO */

@media(max-width:1000px){

    body{
        overflow-y:auto;
        height:auto;
        min-height:100vh;
    }

    .cards{

        flex-direction:column;

        margin-top:20px;

        padding-bottom:50px;
    }

}

@media(max-width:600px){

    .logo{
        margin-top:-20px;
    }

    .logo img{
        width:260px;
    }

    .card{

        width:90%;
        height:auto;

        flex-direction:column;

        text-align:center;
    }

    .texto h2{

        min-height:auto;
    }

    .sidebar{

        width:78%;
        left:-100%;
    }

}

</style>
</head>
<body>

<!-- SIDEBAR -->

<div class="sidebar" id="sidebar">

    <h2>Integrantes</h2>

    <div class="menu-item">
        👨‍💻 Gustavo Damasceno
    </div>

    <div class="menu-item">
        👨‍💻 Nome Integrante 2
    </div>

    <div class="menu-item">
        👨‍💻 Nome Integrante 3
    </div>

    <div class="menu-item">
        👨‍💻 Nome Integrante 4
    </div>

</div>

<!-- OVERLAY -->

<div
class="overlay"
id="overlay"
onclick="fecharMenu()"
></div>

<!-- MENU -->

<div class="topo">

    <div class="menu-btn" onclick="abrirMenu()">
        <div class="menu-icon">☰</div>
    </div>

</div>

<!-- LOGO -->

<div class="logo">
    <img src="matcoin.png" alt="Matcoin">
</div>

<!-- CARDS -->

<div class="cards">

    <!-- QUIZ -->

    <div class="card">

        <div class="icone">
            📝
        </div>

        <div class="texto">

            <h2>Quiz</h2>

            <p>
                Teste seus conhecimentos sobre educação financeira e dinheiro.
            </p>

            <a href="quiz.html" class="botao">
                Acessar →
            </a>

        </div>

    </div>

    <!-- HISTORIA -->

    <div class="card">

        <div class="icone">
            💰
        </div>

        <div class="texto">

            <h2>História do Dinheiro</h2>

            <p>
                Descubra a evolução do dinheiro e sua importância ao longo do tempo.
            </p>

            <a href="historia1.html" class="botao">
                Acessar →
            </a>

        </div>

    </div>

</div>

<script>

function abrirMenu(){

document
.getElementById("sidebar")
.classList
.add("active");

document
.getElementById("overlay")
.classList
.add("active");

}

function fecharMenu(){

document
.getElementById("sidebar")
.classList
.remove("active");

document
.getElementById("overlay")
.classList
.remove("active");

}

</script>

</body>
</html>
