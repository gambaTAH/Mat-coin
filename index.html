<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MatCoin</title>

<style>

/* RESET */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

/* BODY */

body{

    width:100%;
    height:100vh;

    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
    135deg,
    #031b0f 0%,
    #064420 35%,
    #0c8a44 70%,
    #19b95d 100%
    );

    position:relative;
}

/* BRILHO FUNDO */

body::before{

    content:"";

    position:absolute;

    width:900px;
    height:900px;

    background:
    radial-gradient(
    circle,
    rgba(255,255,255,0.12),
    transparent 70%
    );

    top:-300px;
    right:-250px;

    animation:girar 18s linear infinite;
}

body::after{

    content:"";

    position:absolute;

    width:700px;
    height:700px;

    background:
    radial-gradient(
    circle,
    rgba(255,255,255,0.08),
    transparent 70%
    );

    bottom:-250px;
    left:-200px;

    animation:girar2 20s linear infinite;
}

/* CHUVA DE DINHEIRO */

.dinheiro{

    position:absolute;

    top:-120px;

    font-size:38px;

    animation:cair linear infinite;

    opacity:0.95;

    user-select:none;
}

/* MUITOS EMOJIS */

.d1{left:2%;animation-duration:5s;animation-delay:0s;}
.d2{left:6%;animation-duration:7s;animation-delay:1s;}
.d3{left:10%;animation-duration:6s;animation-delay:2s;}
.d4{left:14%;animation-duration:8s;animation-delay:0.5s;}
.d5{left:18%;animation-duration:5s;animation-delay:1.5s;}
.d6{left:22%;animation-duration:7s;animation-delay:0s;}
.d7{left:26%;animation-duration:6s;animation-delay:2s;}
.d8{left:30%;animation-duration:8s;animation-delay:1s;}
.d9{left:34%;animation-duration:5s;animation-delay:0.2s;}
.d10{left:38%;animation-duration:7s;animation-delay:1.8s;}
.d11{left:42%;animation-duration:6s;animation-delay:0.4s;}
.d12{left:46%;animation-duration:8s;animation-delay:2s;}
.d13{left:50%;animation-duration:5s;animation-delay:1s;}
.d14{left:54%;animation-duration:7s;animation-delay:0s;}
.d15{left:58%;animation-duration:6s;animation-delay:2s;}
.d16{left:62%;animation-duration:8s;animation-delay:1s;}
.d17{left:66%;animation-duration:5s;animation-delay:1.4s;}
.d18{left:70%;animation-duration:7s;animation-delay:0.3s;}
.d19{left:74%;animation-duration:6s;animation-delay:1.7s;}
.d20{left:78%;animation-duration:8s;animation-delay:0.6s;}
.d21{left:82%;animation-duration:5s;animation-delay:2s;}
.d22{left:86%;animation-duration:7s;animation-delay:0.7s;}
.d23{left:90%;animation-duration:6s;animation-delay:1.1s;}
.d24{left:94%;animation-duration:8s;animation-delay:0s;}

/* ANIMAÇÃO CHUVA */

@keyframes cair{

    0%{

        transform:
        translateY(-120px)
        rotate(0deg);

        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{

        transform:
        translateY(120vh)
        rotate(360deg);

        opacity:0;
    }

}

/* CONTAINER */

.container{

    position:relative;

    z-index:10;

    text-align:center;

    animation:subir 1.2s ease;
}

/* LOGO */

.logo{

    width:520px;

    max-width:90%;

    margin-bottom:40px;

    filter:
    drop-shadow(0 0 30px rgba(255,255,255,0.25));
}

/* BOTÃO */

.botao{

    display:inline-block;

    padding:18px 60px;

    border-radius:18px;

    text-decoration:none;

    font-size:30px;

    font-weight:bold;

    background:
    linear-gradient(
    90deg,
    #f5c542,
    #ffd95e,
    #ffea94
    );

    color:#0a6b35;

    box-shadow:
    0 10px 25px rgba(0,0,0,0.25);

    transition:0.3s;

    animation:
    pulsar 2s infinite,
    mexer 1.5s infinite;
}

.botao:hover{

    transform:
    scale(1.1);

    box-shadow:
    0 15px 35px rgba(0,0,0,0.35);
}

/* ANIMAÇÕES */

@keyframes pulsar{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.05);
    }

    100%{
        transform:scale(1);
    }

}

@keyframes mexer{

    0%{
        transform:translateY(0px);
    }

    25%{
        transform:translateY(-4px);
    }

    50%{
        transform:translateY(0px);
    }

    75%{
        transform:translateY(4px);
    }

    100%{
        transform:translateY(0px);
    }

}

@keyframes subir{

    from{

        opacity:0;

        transform:translateY(40px);
    }

    to{

        opacity:1;

        transform:translateY(0);
    }

}

@keyframes girar{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

@keyframes girar2{

    from{
        transform:rotate(360deg);
    }

    to{
        transform:rotate(0deg);
    }

}

/* RESPONSIVO */

@media(max-width:700px){

    .logo{

        width:320px;
    }

    .botao{

        font-size:22px;

        padding:16px 40px;
    }

    .dinheiro{

        font-size:28px;
    }

}

</style>
</head>
<body>

<div class="dinheiro d12">💸</div>

<div class="dinheiro d14">💰</div>
<div class="dinheiro d15">🪙</div>
<div class="dinheiro d16">💸</div>
<div class="dinheiro d17">💵</div>
<div class="dinheiro d18">💰</div>
<div class="dinheiro d19">🪙</div>
<div class="dinheiro d20">💸</div>
<div class="dinheiro d21">💵</div>
<div class="dinheiro d22">💰</div>
<div class="dinheiro d23">🪙</div>
<div class="dinheiro d24">💸</div>

<!-- CONTEÚDO -->

<div class="container">

    <img
    src="matcoin.png"
    alt="MatCoin"
    class="logo"
    >

    <br>

    <a
    href="menu.html"

    >
        Entrar →
    </a>

</div>

</body>
</html>
