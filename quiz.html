<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz - MatCoin</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* RESET */

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

/* BODY */

body{

    width: 100%;
    min-height: 100vh;

    background-image: url("fundo.png");
    background-size: cover;
    background-position: center;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow-x: hidden;

    padding: 20px;
}

/* QUIZ BOX */

.quiz-box{

    position: relative;

    width: 90%;
    max-width: 850px;

    background: rgba(255,255,255,0.95);

    border-radius: 35px;

    padding: 80px 40px 40px 40px;

    box-shadow: 0px 10px 40px rgba(0,0,0,0.3);
}

/* BOTAO VOLTAR */

.voltar{

    position:absolute;

    top:25px;
    left:25px;

    text-decoration:none;

    background:rgba(255,255,255,0.95);

    color:#0a6b35;

    padding:12px 22px;

    border-radius:14px;

    font-size:17px;

    font-weight:bold;

    box-shadow:0 5px 15px rgba(0,0,0,0.15);

    transition:0.3s;
}

.voltar:hover{

    transform:scale(1.05);

    background:#19b95d;

    color:white;
}

/* TITULO */

.titulo{

    text-align: center;

    color: #0a6b35;

    font-size: 42px;

    margin-bottom: 20px;
}

/* TEXTO */

.texto{

    text-align: center;

    color: #444;

    font-size: 20px;

    margin-bottom: 30px;
}

/* BOTAO */

.botao{

    background: linear-gradient(90deg,#0c8a44,#19b95d);

    color: white;

    border: none;

    padding: 15px 35px;

    border-radius: 15px;

    font-size: 20px;

    cursor: pointer;

    transition: 0.3s;
}

.botao:hover{

    transform: scale(1.05);
}

/* CENTRALIZAR */

.centralizar{

    text-align: center;
}

/* PERGUNTA */

.pergunta{

    font-size: 30px;

    color: #0a6b35;

    margin-bottom: 30px;

    font-weight: bold;
}

/* ALTERNATIVAS */

.alternativas{

    display: flex;
    flex-direction: column;

    gap: 20px;
}

.alternativa{

    background: #f1f1f1;

    padding: 18px;

    border-radius: 15px;

    cursor: pointer;

    transition: 0.3s;

    font-size: 18px;
}

.alternativa:hover{

    background: #19b95d;

    color: white;

    transform: scale(1.02);
}

/* PROGRESSO */

.progresso{

    margin-bottom: 25px;

    color: #555;

    font-size: 18px;
}

/* RESULTADO */

.resultado{

    display: none;

    text-align: center;
}

canvas{

    max-width: 350px;

    margin: 20px auto;
}

/* ESCONDER */

.esconder{
    display: none;
}

/* RESPONSIVO */

@media(max-width: 700px){

    .quiz-box{

        padding: 90px 25px 25px 25px;
    }

    .titulo{
        font-size: 30px;
    }

    .pergunta{
        font-size: 24px;
    }

    .voltar{

        font-size:15px;

        padding:10px 18px;
    }

}

</style>
</head>
<body>

<div class="quiz-box">

    <!-- VOLTAR -->

    <a href="menu.html" class="voltar">
        ← Voltar ao Menu
    </a>

    <!-- INICIO -->

    <div id="inicio">

        <h1 class="titulo">Quiz MatCoin</h1>

        <p class="texto">
            Responda 10 perguntas aleatórias sobre educação financeira.
        </p>

        <div class="centralizar">

            <button class="botao" onclick="comecarQuiz()">
                Começar
            </button>

        </div>

    </div>

    <!-- QUIZ -->

    <div id="quiz" class="esconder">

        <div class="progresso" id="progresso"></div>

        <div class="pergunta" id="pergunta"></div>

        <div class="alternativas" id="alternativas"></div>

    </div>

    <!-- RESULTADO -->

    <div class="resultado" id="resultado">

        <h1 class="titulo">Resultado Final</h1>

        <p class="texto" id="pontuacao"></p>

        <canvas id="grafico"></canvas>

        <button class="botao" onclick="location.reload()">
            Jogar Novamente
        </button>

    </div>

</div>

<script>

/* 50 PERGUNTAS */

const perguntas = [

{
pergunta: "O que é educação financeira?",
alternativas: ["Aprender sobre dinheiro","Comprar sem pensar","Guardar roupas","Trocar moedas"],
correta: 0
},

{
pergunta: "O que significa economizar?",
alternativas: ["Gastar tudo","Guardar dinheiro","Pedir dinheiro","Comprar jogos"],
correta: 1
},

{
pergunta: "Qual é a função do banco?",
alternativas: ["Guardar dinheiro","Vender comida","Ensinar matemática","Fazer roupas"],
correta: 0
},

{
pergunta: "O que é investimento?",
alternativas: ["Perder dinheiro","Guardar dinheiro parado","Aplicar dinheiro para render","Comprar doces"],
correta: 2
},

{
pergunta: "O que é orçamento?",
alternativas: ["Planejamento financeiro","Tipo de comida","Banco digital","Conta de luz"],
correta: 0
},

{
pergunta: "Qual desses é um gasto essencial?",
alternativas: ["Internet","Alimentação","Video game","Tênis caro"],
correta: 1
},

{
pergunta: "O que é lucro?",
alternativas: ["Dinheiro perdido","Dinheiro ganho","Conta atrasada","Dívida"],
correta: 1
},

{
pergunta: "Guardar dinheiro ajuda em:",
alternativas: ["Emergências","Gastos inúteis","Desperdício","Nada"],
correta: 0
},

{
pergunta: "O que é inflação?",
alternativas: ["Queda dos preços","Aumento dos preços","Promoção","Desconto"],
correta: 1
},

{
pergunta: "Pix é:",
alternativas: ["Comida","Forma de pagamento","Loja","Banco"],
correta: 1
},

{
pergunta: "O que é cartão de crédito?",
alternativas: ["Dinheiro grátis","Empréstimo temporário","Conta de água","Moeda antiga"],
correta: 1
}

];

/* DUPLICAR PRA COMPLETAR 50 */

while(perguntas.length < 50){

perguntas.push(...perguntas.slice(0,10));

}

let perguntasSelecionadas = [];
let perguntaAtual = 0;
let acertos = 0;
let erros = 0;

/* COMEÇAR QUIZ */

function comecarQuiz(){

document.getElementById("inicio").style.display = "none";

document.getElementById("quiz").classList.remove("esconder");

perguntasSelecionadas = perguntas
.sort(() => Math.random() - 0.5)
.slice(0,10);

mostrarPergunta();

}

/* MOSTRAR PERGUNTA */

function mostrarPergunta(){

let pergunta = perguntasSelecionadas[perguntaAtual];

document.getElementById("progresso").innerHTML =
`Pergunta ${perguntaAtual + 1} de 10`;

document.getElementById("pergunta").innerHTML =
pergunta.pergunta;

let alternativasHTML = "";

pergunta.alternativas.forEach((alt,index)=>{

alternativasHTML += `
<div class="alternativa" onclick="responder(${index})">
${alt}
</div>
`;

});

document.getElementById("alternativas").innerHTML =
alternativasHTML;

}

/* RESPONDER */

function responder(indice){

let pergunta = perguntasSelecionadas[perguntaAtual];

if(indice === pergunta.correta){

acertos++;

}else{

erros++;
}

perguntaAtual++;

if(perguntaAtual < 10){

mostrarPergunta();

}else{

mostrarResultado();
}

}

/* RESULTADO */

function mostrarResultado(){

document.getElementById("quiz").style.display = "none";

document.getElementById("resultado").style.display = "block";

document.getElementById("pontuacao").innerHTML =
`Você acertou ${acertos} de 10 perguntas`;

new Chart(document.getElementById("grafico"),{

type: "pie",

data: {

labels: ["Acertos","Erros"],

datasets: [{

data: [acertos, erros],

backgroundColor: [
"#19b95d",
"#ff4d4d"
]

}]

}

});

}

</script>

</body>
</html>
